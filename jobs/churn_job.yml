resources:
  jobs:
    Churn_ETL_and_Scoring_Pipeline:
      name: Churn ETL and Scoring Pipeline
      schedule:
        quartz_cron_expression: 0 0 8 * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: etl_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_churn_lakehouse.id}
        - task_key: batch_scoring
          depends_on:
            - task_key: etl_pipeline
          notebook_task:
            notebook_path: /Workspace/Repos/${workspace.current_user.userName}/churn_lakehouse_mlops/notebooks/Churn_Batch_Scoring
            source: GIT
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 2
      queue:
        enabled: true